name: Release Backend (Tag Driven)

on:
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  JAVA_VERSION: '21'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar (tests already in CI)
        run: ./gradlew --no-daemon clean bootJar -x test

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"  # e.g. backend-v1.8.0
          VERSION=${TAG#backend-v}
          MAJOR=v${VERSION%%.*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compose OCI labels metadata
        id: meta
        run: |
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "created=$CREATED" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (with OCI labels)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tosk-backend
          VERSION: ${{ steps.ver.outputs.version }}
          MAJOR: ${{ steps.ver.outputs.major }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$MAJOR" \
            -t "$IMAGE:latest" \
            --label org.opencontainers.image.title="Tosk Backend" \
            --label org.opencontainers.image.description="Spring Boot backend for Tosk" \
            --label org.opencontainers.image.url="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.created="$CREATED" \
            --label org.opencontainers.image.licenses="Proprietary" \
            --push .

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/tosk-backend:${{ steps.ver.outputs.version }}
          artifact-name: sbom-backend-${{ steps.ver.outputs.version }}
          format: spdx-json
          output-file: sbom-backend-${{ steps.ver.outputs.version }}.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Backend ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            sbom-backend-${{ steps.ver.outputs.version }}.spdx.json
