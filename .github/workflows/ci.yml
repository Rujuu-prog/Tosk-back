name: Backend CI

on:
  pull_request:
    branches: [ main, dev, "release/**" ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2g -XX:+UseG1GC"

jobs:
  # Gradle wrapper検証（サプライチェーン対策）
  Wrapper-Validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

  Spotless:
    runs-on: ubuntu-latest
    needs: [Wrapper-Validation]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4  # Gradleキャッシュを有効化
      - name: Spotless check
        run: ./gradlew --no-daemon spotlessCheck
      - name: Upload Spotless reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotless-reports
          path: "**/build/reports/spotless/*"
          retention-days: 7

  Checkstyle:
    runs-on: ubuntu-latest
    needs: [Wrapper-Validation]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkstyle
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest
      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: "**/build/reports/checkstyle/*"
          retention-days: 7

  PMD:
    runs-on: ubuntu-latest
    needs: [Wrapper-Validation]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: PMD
        run: ./gradlew --no-daemon pmdMain pmdTest
      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: "**/build/reports/pmd/*"
          retention-days: 7

  SpotBugs:
    runs-on: ubuntu-latest
    needs: [Wrapper-Validation]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: SpotBugs
        run: ./gradlew --no-daemon spotbugsMain spotbugsTest
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: "**/build/reports/spotbugs/*"
          retention-days: 7

  Tests:
    runs-on: ubuntu-latest
    needs: [Wrapper-Validation]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit/slice/integration tests
        run: ./gradlew --no-daemon test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/test/*
            **/build/reports/tests/test/*
          retention-days: 7

  JaCoCo:
    runs-on: ubuntu-latest
    needs: [Tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: JaCoCo report & verify thresholds
        run: ./gradlew --no-daemon jacocoTestReport jacocoTestCoverageVerification
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/build/reports/jacoco/test/html/**"
          retention-days: 7

  Build:
    runs-on: ubuntu-latest
    needs: [Spotless, Checkstyle, PMD, SpotBugs, JaCoCo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (no tests; tests already ran)
        run: ./gradlew --no-daemon build -x test
