server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tosk}
    username: ${SPRING_DATASOURCE_USERNAME:tosk}
    password: ${SPRING_DATASOURCE_PASSWORD:tosk}
  jpa:
    hibernate:
      ddl-auto: none
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
