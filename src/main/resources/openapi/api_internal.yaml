openapi: 3.1.0
info:
  title: Tosk Internal API
  description: Internal API documentation for Tosk (Todo + SNS App)
  version: "0.0.1"
servers:
  - url: https://api.tosk.local/v1
    description: Local development server
paths:
  /api/auth/signup:
    post:
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestDTO'
      responses:
        '201':
          description: Signup successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
              examples:
                success:
                  summary: Sample user
                  value:
                    id: "5d1e8c2b-4c9a-4fb0-9f19-9c8c9b0a1234"
                    username: "newuser"
                    email: "newuser@example.com"
                    displayName: "New User"
                    emailVerified: false
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Login successful. Issues JWT cookies.
          headers:
            Set-Cookie:
              description: |
                HttpOnly/Secure cookies will be set on success.
                Examples:
                - ACCESS_TOKEN=jwt...; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=1800
                - REFRESH_TOKEN=jwt...; HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=1209600
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
              examples:
                success:
                  summary: Logged in user
                  value:
                    id: "d3b07384-d9a5-4d5e-bc3f-1a2b3c4d5e6f"
                    username: "user1"
                    email: "user1@example.com"
                    displayName: "User One"
                    emailVerified: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (invalid credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      summary: Get current user information
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      summary: Refresh access token
      security:
        - refreshCookieAuth: []
      responses:
        '200':
          description: New token(s) issued via cookies
          headers:
            Set-Cookie:
              description: |
                Issues a new ACCESS_TOKEN and may rotate REFRESH_TOKEN.
                Examples:
                - ACCESS_TOKEN=jwt...; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=1800
                - REFRESH_TOKEN=jwt...; HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=1209600
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Token reuse detected (session revoked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Logout and clear auth cookies
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Cookies cleared via Set-Cookie with Max-Age=0
          headers:
            Set-Cookie:
              description: |
                Expires ACCESS_TOKEN and REFRESH_TOKEN cookies.
                Examples:
                - ACCESS_TOKEN=deleted; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=0
                - REFRESH_TOKEN=deleted; HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=0
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/verification/start:
    post:
      summary: Start email verification (sends mail)
      security:
        - cookieAuth: []
      responses:
        '202':
          description: Verification mail enqueued
        '401':
          description: Unauthorized

  /api/auth/verification/confirm:
    post:
      summary: Confirm email verification
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/password/reset/start:
    post:
      summary: Start password reset (sends mail)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '202':
          description: Reset mail enqueued (always 202)

  /api/auth/password/reset/confirm:
    post:
      summary: Confirm password reset
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: password
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions:
    get:
      summary: List sessions of current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSessionDTO'
        '401':
          description: Unauthorized
    delete:
      summary: Revoke all sessions
      security:
        - cookieAuth: []
      parameters:
        - name: keepCurrent
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '204':
          description: Revoked
        '401':
          description: Unauthorized

  "/api/auth/sessions/{sid}":
    get:
      summary: Get session detail
      security:
        - cookieAuth: []
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    delete:
      summary: Revoke a session
      security:
        - cookieAuth: []
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '401':
          description: Unauthorized
        '404':
          description: Not found

  

  /users/me:
    get:
      summary: Get current user's profile
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      responses:
        '200':
          description: Successfully retrieved current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /.well-known/jwks.json:
    get:
      summary: Public JWKS
      description: Returns public JWKS for JWT verification (kid-based selection). Includes all active public keys.
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update current user's profile
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successfully updated user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}:
    get:
      summary: Get public profile of a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /teams:
    post:
      summary: Create a new team
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '200':
          description: Successfully created a team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/teams/{teamId}":
    get:
      summary: Get a team's details
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/teams/{teamId}/join-requests":
    post:
      summary: Request to join a team
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully sent join request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/teams/{teamId}/join-requests/{requestId}/approve":
    post:
      summary: Approve a join request
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Join request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden (not team owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team or Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/teams/{teamId}/join-requests/{requestId}/reject":
    post:
      summary: Reject a join request
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Join request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden (not team owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team or Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks:
    post:
      summary: Create a new task
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: Successfully created a task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: List tasks
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
          description: Optional team ID to filter tasks
        - name: visibility
          in: query
          schema:
            type: string
            enum: [ private, team, public ]
          description: Optional visibility filter
        - name: sort
          in: query
          schema:
            type: string
            enum: [ createdAt, deadline, priority ]
          description: Sort by createdAt, deadline, or priority
      responses:
        '200':
          description: Successfully retrieved task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/tasks/{taskId}":
    get:
      summary: Get a task's details
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a task
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Successfully updated a task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a task
      security:
        - cookieAuth: []
        - bearerAuth: [ ]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully deleted a task
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Forbidden (not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT authentication. Server allows small clock skew (~60s) during validation.
    cookieAuth:
      type: apiKey
      in: cookie
      name: AT
      description: HttpOnly/Secure cookie containing short-lived access JWT. Small clock skew (~60s) tolerated.
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: RT
      description: HttpOnly/Secure cookie containing long-lived refresh JWT. Small clock skew (~60s) tolerated.

  schemas:
    SignupRequestDTO:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - username
        - email
        - password

    LoginRequestDTO:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    UserResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        emailVerified:
          type: boolean

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          format: uri
      required:
        - username

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
          format: uri

    TeamCreateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
          format: uri
      required:
        - name

    TeamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

    TaskCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description (optional)
        dueDate:
          type: string
          format: date-time
          description: Due date (optional)
        priority:
          type: string
          enum: [ low, medium, high ]
          description: Task priority
        visibility:
          type: string
          enum: [ private, team, public ]
          description: Task visibility
        teamId:
          type: [ string, "null" ]
          format: uuid
          description: Team ID if the task belongs to a team
      required:
        - title
        - priority
        - visibility

    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date-time
        priority:
          type: string
          enum: [ low, medium, high ]
        visibility:
          type: string
          enum: [ private, team, public ]
        teamId:
          type: [ string, "null" ]
          format: uuid

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date-time
        priority:
          type: string
          enum: [ low, medium, high ]
        visibility:
          type: string
          enum: [ private, team, public ]
        teamId:
          type: [string, "null"]
          format: uuid
        likeCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          enum: [ VALIDATION_ERROR, AUTH_INVALID_CREDENTIALS, AUTH_RATE_LIMIT, TOKEN_INVALID, TOKEN_MISSING, NOT_FOUND, TOKEN_REUSE_DETECTED ]
        message:
          type: string
      required:
        - errorCode
        - message

    AuthSessionDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastRotatedAt:
          type: string
          format: date-time
        revokedAt:
          type: ["string", "null"]
          format: date-time
        ip:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
