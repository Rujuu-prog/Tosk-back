server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: Tosk-backend

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

logging:
  level:
    root: INFO
    org.springframework: INFO
