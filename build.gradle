import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.Confidence

plugins {
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'

    // ---- 品質ゲート ----
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.2.5'
    id 'com.diffplug.spotless' version '6.25.0'
    // ---- OpenAPI Generator ----
    id 'org.openapi.generator' version '7.8.0'
}

group = 'com.tosk.app'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// Windows 文字化け対策（javac出力）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    // ---- Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly   'org.postgresql:postgresql'

    // ---- OpenAPI (Spring Boot 3.3.x 対応)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    // OpenAPI models nullable support (JsonNullable)
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

    // ---- Lombok
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ---- Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'

    // ---- SpotBugs 実行クラスパスを明示
    spotbugs 'com.github.spotbugs:spotbugs:4.9.3'
    spotbugs 'org.apache.commons:commons-lang3:3.17.0'
}

// 開発用クラスパス（DevTools）
configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
}

// spotbugs 構成だけは依存バージョンを強制して安定化
configurations.named('spotbugs') {
    resolutionStrategy {
        force 'com.github.spotbugs:spotbugs:4.9.3'
        force 'org.apache.commons:commons-lang3:3.17.0'
    }
}

// ---- Spotless ----
spotless {
    java {
        googleJavaFormat('1.17.0')
        target 'src/**/*.java'
    }
}

// ---- Checkstyle ----
checkstyle {
    toolVersion = '10.17.0'
    config = resources.text.fromFile("$rootDir/config/checkstyle/checkstyle.xml")
}
// 生成コードはチェック対象外にする
tasks.withType(Checkstyle).configureEach {
    exclude 'generated/**'
}
// checkstyleMain は手動で src/main/java のみを対象にする（生成コードを除外）
tasks.named('checkstyleMain') {
    source = fileTree(dir: "$rootDir/src/main/java")
}

// ---- PMD ----
pmd {
    toolVersion = '7.0.0'
    // Use custom rulesets (main/test) to tune noise vs. signal
    ruleSetFiles = files("$rootDir/config/pmd/pmd-rules-main.xml")
    ruleSets = []
    // 初期構築期に落ちにくくしたいなら ↓を true に変更（違反があっても失敗にしない）
    ignoreFailures = false
    consoleOutput = true
}
// 生成コードはPMD対象外
tasks.withType(Pmd).configureEach {
    exclude '**/generated/**'
}

// テスト用は軽量ルールセット（assert強制など一部除外）
tasks.named('pmdTest') {
    ruleSetFiles = files("$rootDir/config/pmd/pmd-rules-test.xml")
    ruleSets = []
    enabled = true
}

// ---- SpotBugs ----
// 6.2系の既定に合わせて 4.9.3 を明示。Groovy DSLは valueOf(...) が安定
spotbugs {
    toolVersion = '4.9.3'
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('MEDIUM')
    jvmArgs = ['-Dfile.encoding=UTF-8'] // Windows端末での文字化け防止
}
// レポート形式などはタスク側で
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required.set(true)
        xml.required.set(false)
        sarif.required.set(false)
    }
    // 初期は落ちにくくしたいなら ↓を true に（違反があっても失敗しない）
    ignoreFailures = false
    // 生成コードは対象外（パッケージで除外）
    excludeFilter = file("$rootDir/config/spotbugs/exclude-generated.xml")
}
tasks.named('spotbugsMain') {
    classes = files(fileTree(dir: "$buildDir/classes/java/main", exclude: ['**/com/tosk/app/generated/**']))
    dependsOn 'openApiGenerateBackend', 'compileJava'
}

// ---- JaCoCo ----
jacoco { toolVersion = '0.8.12' } // 0.8.13に上げてもOK

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
        csv.required.set(false)
    }
    // 生成コードはカバレッジ対象外
    def generatedExclusions = ['**/com/tosk/app/generated/**']
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: generatedExclusions) }))
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
    // 生成コードは判定対象外
    def generatedExclusions = ['**/com/tosk/app/generated/**']
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: generatedExclusions) }))
}

// JaCoCoは verify 前にテスト＆レポートを作らせる
tasks.named('jacocoTestReport') { dependsOn 'test' }
tasks.named('jacocoTestCoverageVerification') { dependsOn 'test' }

// 落ちたらビルド失敗＝厳格モード
tasks.named('check') {
    dependsOn(
            'spotbugsMain', 'spotbugsTest',
            'pmdMain', 'pmdTest',
            'checkstyleMain', 'checkstyleTest',
            'jacocoTestCoverageVerification',
            'jacocoTestReport' // レポート生成
    )
}

// Actuator /info にビルド情報を露出（version, time, commit 等）
springBoot {
    buildInfo()
}

// ---- OpenAPI code generation ----
def openApiSpec = "$rootDir/src/main/resources/openapi/api_internal.yaml"

tasks.register('openApiGenerateBackend', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    group = 'openapi'
    description = 'Generate Spring interfaces and models from OpenAPI'
    generatorName = 'spring'
    inputSpec = openApiSpec
    outputDir = "$rootDir/generated/backend-openapi"
    apiPackage = 'com.tosk.app.generated.api'
    modelPackage = 'com.tosk.app.generated.model'
    invokerPackage = 'com.tosk.app.generated.invoker'
    configOptions = [
            useSpringBoot3: 'true',
            interfaceOnly : 'true',
            // useTags    : 'true', // 現状タグ未定義エンドポイントが多いためオフにしてまとめる
            dateLibrary   : 'java8',
            library       : 'spring-boot'
    ]
    additionalProperties = [
            debugOpenAPI   : 'true',
            debugModels    : 'true',
            debugOperations: 'true'
    ]
    globalProperties = [
            apis            : '',
            models          : '',
            supportingFiles : '',
            apiDocs         : 'false',
            modelDocs       : 'false',
            apiTests        : 'false',
            modelTests      : 'false'
    ]

    cleanupOutput = true
}

sourceSets {
    main {
        java {
            srcDir "$rootDir/generated/backend-openapi/src/main/java"
        }
    }
}

tasks.named('compileJava') { dependsOn 'openApiGenerateBackend' }

// Frontend TypeScript client (axios)
tasks.register('openApiGenerateFrontend', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    group = 'openapi'
    description = 'Generate TypeScript Axios client from OpenAPI'
    generatorName = 'typescript-axios'
    inputSpec = openApiSpec
    outputDir = "$rootDir/generated/frontend-openapi"
    additionalProperties = [
            supportsES6              : 'true',
            useSingleRequestParameter: 'true',
            modelPropertyNaming      : 'original',
            enumPropertyNaming       : 'original',
            npmName                  : 'tosk-openapi-client',
            npmVersion               : '0.1.0'
    ]
    globalProperties = [
            apis            : '',
            models          : '',
            supportingFiles : '',
            apiDocs         : 'false',
            modelDocs       : 'false',
            apiTests        : 'false',
            modelTests      : 'false'
    ]
    // 一部環境で生成後にディレクトリが消える事象があるため、クリーンは行わない
    cleanupOutput = false
}

tasks.named('build') {
    dependsOn 'openApiGenerateBackend'
}
